name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Nightly at 02:00 UTC: includes live-API e2e to catch upstream API changes.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: node scripts/check-dist-versions.mjs
      - run: npm run typecheck
      - run: npm run docs:validate --workspace packages/server
      - run: npm run build
      - run: node scripts/sync-plugin-bundle.mjs --check
      - run: npm test
      - run: npm run build:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-extension
          path: dist-mcpb/*.mcpb
      # Hosted mode: the image must build and answer /healthz with the bundled docs index.
      - run: docker build -t nextbillion-mcp:ci .
      - run: |
          cid=$(docker run -d -p 18080:8080 -e NBAI_PUBLIC_URL=http://localhost:18080 nextbillion-mcp:ci)
          for i in $(seq 1 20); do curl -fsS http://localhost:18080/healthz && break || sleep 1; done
          curl -fsS http://localhost:18080/.well-known/oauth-protected-resource
          docker logs "$cid" | grep -q 'listening on http' || (docker logs "$cid"; exit 1)
          docker rm -f "$cid"

  image:
    # Publishes the hosted image to the company registry on release tags. Runs on the
    # company's self-hosted runners, which provide `nip` and its registry credentials
    # (see nextbillion-ai/github-runner); pushes to
    # asia-southeast1-docker.pkg.dev/nextbillion/internal/nextbillion-mcp:<tag>.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          [ "$tag" = "$GITHUB_REF" ] && tag="sha-${GITHUB_SHA::7}"
          export DOCKER_CONFIG="$(mktemp -d)"
          NIP_TARGETS=asia-southeast1 nip -t "nextbillion-mcp:${tag}" .
          echo "pushed asia-southeast1-docker.pkg.dev/nextbillion/internal/nextbillion-mcp:${tag}"

  e2e:
    # Live-API smoke tests; needs the NBAI_API_KEY secret (sandbox key).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          NBAI_API_KEY: ${{ secrets.NBAI_API_KEY }}
